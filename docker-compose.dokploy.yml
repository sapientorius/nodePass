# Dokploy Docker Compose (not Swarm Stack). Configure Domains for app, port 3000.
# Dokploy adds its own ingress labels/network. Database has no host ports.
# Import with dokploy.toml to generate persistent secrets automatically.
# Default: verified nodePass 0.1.2. Override NODEPASS_IMAGE with another verified digest.
services:
  app:
    image: ${NODEPASS_IMAGE:-ghcr.io/sapientorius/nodepass@sha256:b23fb1b2f0382b8e051b9099ffd07fe12ef16b284d844e90b9e8ef93f4008880}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    tmpfs: ["/tmp:size=64m,mode=1777"]
    expose: ["3000"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set the HTTPS domain assigned in Dokploy}
      DEPLOYMENT_KEY: ${DEPLOYMENT_KEY:?Generate 32 random bytes as base64}
      SETUP_TOKEN: ${SETUP_TOKEN:?Generate a random setup token}
      DB_HOST: db
      DB_NAME: nodepass
      DB_USER: nodepass
      DB_PASSWORD: ${DB_PASSWORD:?Generate a database password}
      TRUST_PROXY: "1"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-dokploy-traefik}
    volumes: [nodepass-data:/app/data]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:12.2@sha256:6a4c4bbf0447c2247801309513fcc0dd17c3f35390368139ce419387fdd1144d
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: nodepass
      MARIADB_USER: nodepass
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate a separate root password}
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  nodepass-data:
  database:
