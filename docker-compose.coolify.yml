# Coolify Compose Service: paste directly into Docker Compose Empty.
# Assign the public HTTPS domain to app:3000. Coolify generates the secrets.
# Default: verified nodePass 0.1.3. Override NODEPASS_IMAGE with another verified digest.
services:
  app:
    image: ${NODEPASS_IMAGE:-ghcr.io/sapientorius/nodepass@sha256:5d92a07fb2e736ed8c9befe54c3eff85089435ae0f3991921e1c38af49ee4cee}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    tmpfs: ["/tmp:size=64m,mode=1777"]
    expose: ["3000"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set the HTTPS domain assigned to app}
      DEPLOYMENT_KEY: ${SERVICE_REALBASE64_32_NODEPASSKEY:?Keep the generated deployment key}
      SETUP_TOKEN: ${SERVICE_PASSWORD_64_NODEPASSSETUP:?Keep the generated setup token}
      DB_HOST: db
      DB_NAME: nodepass
      DB_USER: nodepass
      DB_PASSWORD: ${SERVICE_PASSWORD_64_NODEPASSDB:?Keep the generated database password}
      TRUST_PROXY: "1"
      # Coolify connects this named proxy to the stack network automatically.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-coolify-proxy}
    volumes: [nodepass-data:/app/data]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: nodepass
      MARIADB_USER: nodepass
      MARIADB_PASSWORD: ${SERVICE_PASSWORD_64_NODEPASSDB:?}
      MARIADB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_NODEPASSDBROOT:?Keep the generated root password}
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  nodepass-data:
  database:
