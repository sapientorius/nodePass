title = "nodePass secret scanning"
[extend]
useDefault = true
[[allowlists]]
description = "Generated dependencies and local private test/runtime state are not source artifacts"
paths = ['''(^|/)node_modules/''', '''(^|/)\.cache/''', '''(^|/)dist/''', '''(^|/)coverage/''', '''(^|/)output/''', '''(^|/)test-results/''', '''(^|/)playwright-report/''']
[[allowlists]]
description = "Reviewed synthetic interoperability vectors copied from upstream PHP tests or generated by tests/reference.php; never production credentials"
paths = ['''tests/fixtures/reference\.json$''', '''tests/fixtures/syspass-account-crypt\.xml$''', '''tests/fixtures/config\.xml$''']

[[allowlists]]
description = "Four exact public upstream sysPass XML test keys; see NOTICE.md. All other values in this fixture remain scanned."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/fixtures/syspass-export-encrypted\.xml$''']
regexTarget = "secret"
regexes = [
  '''^$''',
  '''^$''',
  '''^$''',
  '''^$''',
]
