name: nodePass verification
on:
  push:
    branches: ["main"]
    tags: ["nodepass-v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: nodepass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    working-directory: .
jobs:
  verify:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
        env:
          MARIADB_DATABASE: nodepass_test
          MARIADB_USER: nodepass
          MARIADB_PASSWORD: nodepass_ci_only
          MARIADB_ROOT_PASSWORD: nodepass_ci_root_only
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: defuse/php-encryption
          ref: 77880488b9954b7884c25555c2a0ea9e7053f9d2
          path: .cache/defuse
          persist-credentials: false
      - run: docker run --rm --network none -v "$PWD:/workspace" -e NODEPASS_REFERENCE_OUTPUT=/workspace/.cache/php-reference.json php:8.4-cli@sha256:40638d9d5ec50bbf20205a06c733fff5839fc13b0a7c8e10e455b49da2a13068 php /workspace/tests/reference.php
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:assets
      - run: npm run check:publication
      - run: npm run check:release
      - run: npm run audit
      - run: node scripts/ci-env.mjs
      - run: node --env-file=.cache/integration.env scripts/wait-db.mjs
      - run: node scripts/run-integration.mjs --coverage
        env:
          NODEPASS_REQUIRE_PHP_REFERENCE: "1"
      - run: npm exec playwright -- install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: nodepass-verification
          path: |
            coverage
            playwright-report
            output/playwright
          retention-days: 7
  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.prepare.outputs.digest }}
      checksums: ${{ steps.prepare.outputs.checksums }}
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .cache/semgrep-rules
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify release identity
        id: version
        run: npm run check:release
      - run: npm run check:exceptions
      - run: node scripts/audit-rules.mjs .cache/semgrep-rules
      - run: node scripts/stage-source.mjs
      - run: mkdir -p output/security
      - run: docker run --rm --network none -v "$PWD/.cache/security-source:/src:ro" -v "$PWD/.cache/semgrep-security.json:/rules.json:ro" -v "$PWD/output/security:/reports" -w /src semgrep/semgrep@sha256:3db5c7af55eb1f512eac0abf0ab69a97b52c74b5e9a27314c221aee1a78d7ab2 semgrep scan --config security/semgrep.yml --config /rules.json --metrics=off --disable-version-check --strict --json --output /reports/semgrep.json --error packages/server/src packages/web/src scripts
      - run: docker run --rm --network none -v "$PWD/.cache/security-source:/src:ro" -w /src zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir --config .gitleaks.toml --redact --no-banner .
      - name: Build the image that will be tested and published
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          docker build --platform linux/amd64 --provenance=false --sbom=false
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --label "org.opencontainers.image.version=$RELEASE_VERSION"
          --label "org.opencontainers.image.source=https://github.com/sapientorius/nodePass"
          --tag nodepass:ci .
      - run: npm run check:compose
      - run: npm run test:container
        env:
          NODEPASS_TEST_IMAGE: nodepass:ci
      - run: docker save --output /tmp/nodepass.tar nodepass:ci
      - run: docker run --rm -v /tmp/nodepass.tar:/image.tar:ro -v "$PWD/output/security:/reports" aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --input /image.tar --exit-code 1 --severity HIGH,CRITICAL --format json --output /reports/trivy-image.json
      - run: docker run --rm -v "$PWD/.cache/security-source:/src:ro" -v "$PWD/output/security:/reports" aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c config --exit-code 1 --severity HIGH,CRITICAL --format json --output /reports/trivy-config.json /src
      - run: docker run --rm -v /tmp/nodepass.tar:/image.tar:ro -v "$PWD:/reports" aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --input /image.tar --format cyclonedx --output /reports/sbom.cdx.json
      - run: sha256sum /tmp/nodepass.tar sbom.cdx.json > output/security/SHA256SUMS
      - run: docker image inspect nodepass:ci --format '{{json .}}' > output/security/image-manifest.json
      - name: Preserve the tested image as an OCI layout
        run: |
          mkdir -p .cache/release
          docker run --rm --user "$(id -u):$(id -g)" -v /tmp/nodepass.tar:/image.tar:ro -v "$PWD/.cache/release:/release" ghcr.io/regclient/regctl@sha256:45b57933c2b67bb1e280b4baaa220ef1ab212c81268ab19589fa1e83719c7c82 image import ocidir:///release/imported:release /image.tar
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/.cache/release:/release" ghcr.io/regclient/regctl@sha256:45b57933c2b67bb1e280b4baaa220ef1ab212c81268ab19589fa1e83719c7c82 image copy --platform linux/amd64 ocidir:///release/imported:release ocidir:///release/oci:release
      - name: Prepare and validate deployment artifacts
        id: prepare
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npm run release:prepare
          else
            npm run release:prepare -- --dry-run
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'sapientorius/nodePass'
        with:
          name: nodepass-release-${{ github.sha }}
          path: |
            .cache/release/oci
            .cache/release/assets
            .cache/release/release-notes.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: nodepass-sbom
          path: |
            sbom.cdx.json
            output/security
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MariaDB 10.11
            image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
            health: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 11.4
            image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.4
            image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
            health: mysqladmin ping -h 127.0.0.1 --silent
    name: Compatibility (${{ matrix.name }})
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MARIADB_DATABASE: nodepass_test
          MARIADB_USER: nodepass
          MARIADB_PASSWORD: nodepass_ci_only
          MARIADB_ROOT_PASSWORD: nodepass_ci_root_only
          MYSQL_DATABASE: nodepass_test
          MYSQL_USER: nodepass
          MYSQL_PASSWORD: nodepass_ci_only
          MYSQL_ROOT_PASSWORD: nodepass_ci_root_only
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=5s --health-retries=40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci-env.mjs
      - run: node --env-file=.cache/integration.env scripts/wait-db.mjs
      - run: node scripts/run-integration.mjs
  workflow-audit:
    name: Workflow and Dockerfile audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker run --rm --network none -v "$PWD:/src:ro" -w /src rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/workflows/nodepass.yml
      - run: docker run --rm --network none -v "$PWD:/src:ro" ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --offline --min-severity low /src/.github/workflows
      - run: docker run --rm --network none -v "$PWD:/src:ro" -w /src hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint Dockerfile
  application-scan:
    name: Authenticated application scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      db:
        image: mariadb:11.8@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
        env:
          MARIADB_DATABASE: nodepass_test
          MARIADB_USER: nodepass
          MARIADB_PASSWORD: nodepass_ci_only
          MARIADB_ROOT_PASSWORD: nodepass_ci_root_only
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci-env.mjs
      - run: node --env-file=.cache/integration.env scripts/wait-db.mjs
      - run: node scripts/zap.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: nodepass-application-scan
          path: output/security
  release-gate:
    name: Required release checks
    runs-on: ubuntu-24.04
    if: always()
    needs: [verify, security, compatibility, workflow-audit, application-scan]
    steps:
      - name: Require every verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        working-directory: .
        run: node -e "if(Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== 'success')) process.exit(1)"
  release-hosting:
    name: Release hosting checks
    needs: [release-gate, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/nodepass-v') && github.repository == 'sapientorius/nodePass'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/check-release-hosting.mjs
  publish:
    name: Approve and publish verified artifacts
    needs: [release-hosting, release-gate, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/nodepass-v') && github.repository == 'sapientorius/nodePass'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/sapientorius/nodePass/releases
    concurrency:
      group: nodepass-release-publication
      cancel-in-progress: false
    permissions:
      contents: write # Attach verified assets and publish the immutable GitHub Release.
      packages: write # Upload the preserved, tested image to this repository's GHCR package.
      id-token: write # Obtain the short-lived OIDC identity for release attestations.
      attestations: write # Store provenance, SBOM and asset attestations for this release.
    env:
      EXPECTED_DIGEST: ${{ needs.security.outputs.digest }}
      EXPECTED_CHECKSUMS_SHA256: ${{ needs.security.outputs.checksums }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nodepass-release-${{ github.sha }}
          path: .cache/release
      - run: node scripts/verify-release.mjs
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-image.mjs
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/sapientorius/nodepass
          subject-digest: ${{ needs.security.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/sapientorius/nodepass
          subject-digest: ${{ needs.security.outputs.digest }}
          sbom-path: .cache/release/assets/sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest downloadable release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .cache/release/assets/*
          create-storage-record: false
      - name: Upload assets to a draft, then publish the immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
      - name: Advance latest for the new stable release
        if: ${{ !contains(needs.security.outputs.version, '-rc.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-image.mjs --latest
